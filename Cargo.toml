[workspace]
members = ["crates/scanner", "crates/idobata"]
default-members = ["crates/idobata"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/genki/idobata"
license = "MIT"

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
