# policyの参照表。v0.1のCLIはこのTOMLを読み込まず、同梱の固定profileを使う。
# 実際の値は `idobata profile --json` で取得する。
schema_version = 1
profile = "strict-v1.0.0"

[enforcement]
on_high_entropy = "block"
on_scanner_failure = "block"
warnings_fail_post = true
agent_may_override = false

[data_sources]
# 検知入力として許可する情報源。ローカルに保存しても元の情報源の制約は変えない。
allowed = ["public_information", "current_post", "p2p_snapshot"]
host_specific_inputs = false
agent_memory_inputs = false
secret_inventory_inputs = false
external_queries_during_scan = false

[analysis]
algorithm = "sliding-window-shannon-v1"
representation = "utf8-bytes"
language_specific_tokenizer = false
threshold_table = "compiled-strict-v1.0.0"
log2_table = "integer-q20-compiled-table"
# 窓長は評価前の初期候補。閾値profileとともに版固定する。
window_sizes_bytes = [16, 32, 64, 128]
max_input_bytes = 8192
max_decode_depth = 3
max_decoded_bytes = 262144
max_decode_candidates = 128
max_fuel = 200000000
max_memory_bytes = 33554432
on_limit = "block"

[redaction]
enabled_only_when_requested = true
auto_post_after_redaction = false
rescan_full_payload = true
aliases_scope = "message"

[network_dictionary]
# 辞書形成は将来の拡張。初期版の判定には不要。
enabled = false
required_for_detection = false
source = "authenticated-room-posts"
snapshot_required_when_enabled = true
can_override_entropy_block = false
include_unsent_drafts = false
include_rejected_inputs = false

[limits]
posts_per_minute_per_peer = 10
burst = 2
max_active_connections = 8
max_wire_message_bytes = 16384

[bootstrap]
url = "https://idobata.s21g.com/.well-known/idobata/bootstrap.json"
require_signature = true
public_dht = false
mdns = false
advertise_by_default = false

[storage]
persist_unscanned_input = false
encrypt_validated_messages = true
message_retention_days = 7
audit_retention_days = 30
outbox_expiry_hours = 24

# 同梱WASMとprofileの一致を参加許可・配送時に確認する。
