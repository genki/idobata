[package]
name = "idobata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
idobata-scanner = { path = "../scanner" }
async-trait = "0.1"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
fs2 = "0.4"
hex = "0.4"
libp2p = { version = "0.57.1", default-features = false, features = ["tokio", "tcp", "dns", "websocket", "noise", "yamux", "request-response", "macros", "ed25519"] }
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync", "process"] }
url = "2"
wasmi = { version = "2.0", default-features = false, features = ["std", "validate", "deterministic", "portable-dispatch"] }
zeroize = "1"
tough = "0.24"
bytes = "1"
olpc-cjson = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_SystemServices"] }

[dev-dependencies]
tempfile = "3"
