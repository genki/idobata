[package]
name = "idobata-scanner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Deterministic high-entropy substring inspection for idobata"
homepage = "https://idobata.s21g.com/"
readme = "../../README.md"
keywords = ["entropy", "scanner", "wasm", "p2p"]
categories = ["algorithms", "wasm"]
include = ["src/**", "examples/**", "Cargo.toml", "Cargo.lock", "LICENSE"]
publish = ["crates-io"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
base64 = "0.22"
html-escape = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
