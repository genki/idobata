# BEGIN IDOBATA SITE
# Only these fixed categories and numeric measurements enter the new access log.
# Original request_uri is used only for classification, including after try_files.
map $request_uri $idobata_http_route {
  default other;
  ~^/(?:[?]|$) home;
  ~^/docs/?(?:[?]|$) docs;
  ~^/agents[.]md(?:[?]|$) agents;
  ~^/llms[.]txt(?:[?]|$) llms;
  ~^/[.]well-known/idobata/agent[.]json(?:[?]|$) descriptor;
  ~^/releases(?:[.]json|/.*)(?:[?]|$) release;
  ~^/(?:posts|publisher)[.]json(?:[?]|$) feed;
  ~^/updates/ update;
  ~^/[.]well-known/idobata/bootstrap[.]json(?:[?]|$) bootstrap;
  ~^/(?:healthz|revision[.]json)(?:[?]|$) health;
  ~^/(?:style[.]css|app[.]js|icon[.]png|icon[.]webp|trust[.]js|trust-root[.]json|trust[.]json|verify-feed[.]js|analytics[.]js|analytics-frame[.]html|analytics-sender[.]js)(?:[?]|$) asset;
}
map $http_user_agent $idobata_http_ua {
  default other;
  ~*(?:GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-User|Claude-SearchBot|anthropic-ai|PerplexityBot|Perplexity-User) ai_agent;
  ~*(?:Googlebot|bingbot|DuckDuckBot|Slurp|Baiduspider|YandexBot|Applebot) search_bot;
  ~*(?:Mozilla/|AppleWebKit/|Chrome/|Safari/|Firefox/|Edg/) browser;
}
map $http_referer $idobata_http_referrer {
  default other;
  "" direct;
  ~*^https?://(?:www[.])?(?:google[.]com|google[.]co[.]jp|bing[.]com|duckduckgo[.]com|search[.]yahoo[.]com|search[.]yahoo[.]co[.]jp|baidu[.]com|yandex[.]com)(?::[0-9]+)?(?:/|[?]|$) search;
  ~*^https?://(?:www[.]|gist[.])?github[.]com(?::[0-9]+)?(?:/|[?]|$) github;
  ~*^https?://(?:chatgpt[.]com|chat[.]openai[.]com|claude[.]ai|www[.]perplexity[.]ai|perplexity[.]ai|copilot[.]microsoft[.]com|gemini[.]google[.]com)(?::[0-9]+)?(?:/|[?]|$) ai;
  ~*^https?://(?:[a-z0-9-]+[.])*s21g[.]com(?::[0-9]+)?(?:/|[?]|$) s21g;
}
map $request_method $idobata_http_method {
  default other;
  GET GET;
  HEAD HEAD;
}
map $arg_analytics $idobata_http_query_diagnostic {
  default 0;
  off 1;
}
map $http_x_idobata_diagnostic $idobata_http_header_diagnostic {
  default 0;
  1 1;
}
map "$idobata_http_query_diagnostic:$idobata_http_header_diagnostic" $idobata_http_diagnostic {
  default 0;
  ~1 1;
}
map "$idobata_http_diagnostic:$idobata_http_route" $idobata_http_traffic {
  default other;
  ~^1: diagnostic;
  ~^0:(?:home|docs|agents|llms|descriptor)$ document;
  ~^0:(?:feed|update|bootstrap)$ poll;
  "0:release" release;
  "0:asset" asset;
  "0:health" health;
}
log_format idobata_http_v1 escape=json
  '{"schema":"idobata_http_v1","route":"$idobata_http_route",'
  '"ua_class":"$idobata_http_ua","referrer_class":"$idobata_http_referrer",'
  '"traffic_class":"$idobata_http_traffic","method":"$idobata_http_method",'
  '"status":$status,"bytes":$body_bytes_sent,"request_seconds":$request_time}';
server {
  listen 80;
  server_name idobata.s21g.com;
  access_log /dev/stdout idobata_http_v1;
  return 308 https://idobata.s21g.com$request_uri;
}
server {
  listen 443 ssl;
  http2 on;
  server_name idobata.s21g.com;
  ssl_certificate /etc/nginx/certs/s21g/tls.crt;
  ssl_certificate_key /etc/nginx/certs/s21g/tls.key;
  # Additional measurement logs never include raw IP/UA/URI/referrer/headers.
  # Existing nginx error-log policy is unchanged and outside this schema.
  access_log /dev/stdout idobata_http_v1;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }
  location = / { root /srv/idobata/site; try_files /idobata-index.html =404; default_type text/html; expires -1; }
  location = /docs { return 308 /docs/; }
  location = /docs/ { root /srv/idobata/site; try_files /idobata-docs.html =404; default_type text/html; expires -1; }
  location = /agents.md { alias /srv/idobata/site/idobata-agents.md; default_type text/markdown; charset utf-8; charset_types text/markdown; expires -1; }
  location = /llms.txt { alias /srv/idobata/site/idobata-llms.txt; default_type text/plain; charset utf-8; charset_types text/plain; expires -1; }
  location = /.well-known/idobata/agent.json { alias /srv/idobata/site/idobata-agent.json; default_type application/json; expires -1; }
  location = /analytics.js { alias /srv/idobata/site/idobata-analytics.js; default_type text/javascript; charset utf-8; charset_types text/javascript; expires 5m; }
  location = /analytics-sender.js { alias /srv/idobata/site/idobata-analytics-sender.js; default_type text/javascript; charset utf-8; charset_types text/javascript; expires 5m; }
  location = /analytics-frame.html {
    alias /srv/idobata/site/idobata-analytics-frame.html;
    default_type text/html;
    charset utf-8;
    expires -1;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://www.googletagmanager.com; connect-src https://www.google-analytics.com https://region1.google-analytics.com; img-src https://www.google-analytics.com https://region1.google-analytics.com; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
  }
  location = /style.css { alias /srv/idobata/site/idobata-style.css; expires 5m; }
  location = /app.js { alias /srv/idobata/site/idobata-app.js; default_type application/javascript; expires 5m; }
  location = /icon.png { return 308 /icon.webp; }
  location = /icon.webp { alias /srv/idobata/site/idobata-icon.webp; default_type image/webp; expires 1d; }
  location = /posts.json { alias /srv/idobata/feed/posts.json; default_type application/json; expires -1; }
  location = /publisher.json { alias /srv/idobata/feed/publisher.json; default_type application/json; expires -1; }
  location = /trust-root.json { alias /srv/idobata/site/idobata-trust-root.json; default_type application/json; expires -1; }
  location = /trust.json { alias /srv/idobata/site/idobata-trust.json; default_type application/json; expires -1; }
  location = /trust.js { alias /srv/idobata/site/idobata-trust.js; default_type application/javascript; expires -1; }
  location = /verify-feed.js { alias /srv/idobata/site/idobata-verify-feed.js; default_type application/javascript; expires 5m; }
  location = /updates/root.json { alias /srv/idobata/feed/tuf-root.json; default_type application/json; expires -1; }
  location = /updates/1.root.json { alias /srv/idobata/feed/tuf-1.root.json; default_type application/json; expires -1; }
  location = /updates/targets.json { alias /srv/idobata/feed/tuf-targets.json; default_type application/json; expires -1; }
  location = /updates/snapshot.json { alias /srv/idobata/feed/tuf-snapshot.json; default_type application/json; expires -1; }
  location = /updates/timestamp.json { alias /srv/idobata/feed/tuf-timestamp.json; default_type application/json; expires -1; }
  location /updates/ { return 404; }
  location = /releases.json { alias /srv/idobata/site/idobata-releases.json; default_type application/json; expires -1; }
  location = /releases/idobata-0.2.0-linux-x86_64.tar.gz { return 302 https://github.com/genki/idobata/releases/download/v0.2.0/idobata-0.2.0-linux-x86_64.tar.gz; }
  location = /releases/idobata-0.2.0-macos-arm64.tar.gz { return 302 https://github.com/genki/idobata/releases/download/v0.2.0/idobata-0.2.0-macos-arm64.tar.gz; }
  location = /releases/idobata-0.2.0-windows-x86_64.zip { return 302 https://github.com/genki/idobata/releases/download/v0.2.0/idobata-0.2.0-windows-x86_64.zip; }
  location = /releases/idobata-0.3.0-linux-x86_64.tar.gz { return 302 https://github.com/genki/idobata/releases/download/v0.3.0/idobata-0.3.0-linux-x86_64.tar.gz; }
  location = /releases/idobata-0.3.0-macos-arm64.tar.gz { return 302 https://github.com/genki/idobata/releases/download/v0.3.0/idobata-0.3.0-macos-arm64.tar.gz; }
  location = /releases/idobata-0.3.0-windows-x86_64.zip { return 302 https://github.com/genki/idobata/releases/download/v0.3.0/idobata-0.3.0-windows-x86_64.zip; }
  location = /releases/idobata-0.4.0-linux-x86_64.tar.gz { return 302 https://github.com/genki/idobata/releases/download/v0.4.0/idobata-0.4.0-linux-x86_64.tar.gz; }
  location = /releases/idobata-0.4.0-macos-arm64.tar.gz { return 302 https://github.com/genki/idobata/releases/download/v0.4.0/idobata-0.4.0-macos-arm64.tar.gz; }
  location = /releases/idobata-0.4.0-windows-x86_64.zip { return 302 https://github.com/genki/idobata/releases/download/v0.4.0/idobata-0.4.0-windows-x86_64.zip; }
  location = /revision.json { alias /srv/idobata/site/idobata-revision.json; default_type application/json; expires -1; }
  location = /healthz { default_type text/plain; return 200 "idobata ok\n"; }
  location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nAllow: /\nSitemap: https://idobata.s21g.com/sitemap.xml\n"; }
  location = /sitemap.xml { alias /srv/idobata/site/idobata-sitemap.xml; default_type application/xml; expires 1h; }
  # 公開WSSの署名付き受領が新鮮な間だけ広告する。未検証時は503。
  location = /.well-known/idobata/bootstrap.json { root /srv/idobata/feed; try_files /bootstrap.json =503; default_type application/json; expires -1; }
  location / { return 404; }
}
server {
  listen 80;
  server_name idobata-peer.s21g.com;
  return 308 https://idobata-peer.s21g.com$request_uri;
}
server {
  listen 443 ssl;
  http2 on;
  server_name idobata-peer.s21g.com;
  ssl_certificate /etc/nginx/certs/s21g/tls.crt;
  ssl_certificate_key /etc/nginx/certs/s21g/tls.key;
  access_log off;
  location / {
    proxy_pass http://home_web;
    proxy_set_header Host idobata-peer.s21g.com;
    proxy_set_header Authorization "";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
}
# END IDOBATA SITE
