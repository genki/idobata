# BEGIN IDOBATA SITE
server {
  listen 80;
  server_name idobata.s21g.com;
  return 308 https://idobata.s21g.com$request_uri;
}
server {
  listen 443 ssl;
  http2 on;
  server_name idobata.s21g.com;
  ssl_certificate /etc/nginx/certs/s21g/tls.crt;
  ssl_certificate_key /etc/nginx/certs/s21g/tls.key;
  # IP・User-Agentを含む公開サイトのアクセスログを蓄積しない。
  access_log off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }
  location = / { root /etc/moon-frontdoor; try_files /idobata-index.html =404; default_type text/html; expires -1; }
  location = /docs { return 308 /docs/; }
  location = /docs/ { root /etc/moon-frontdoor; try_files /idobata-docs.html =404; default_type text/html; expires -1; }
  location = /style.css { alias /etc/moon-frontdoor/idobata-style.css; expires 5m; }
  location = /app.js { alias /etc/moon-frontdoor/idobata-app.js; default_type application/javascript; expires 5m; }
  location = /icon.png { alias /etc/moon-frontdoor/idobata-icon.png; expires 1d; }
  location = /posts.json { alias /etc/moon-frontdoor/idobata-posts.json; default_type application/json; expires -1; }
  location = /publisher.json { alias /etc/moon-frontdoor/idobata-publisher.json; default_type application/json; expires -1; }
  location = /healthz { default_type text/plain; return 200 "idobata ok\n"; }
  location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nAllow: /\nSitemap: https://idobata.s21g.com/sitemap.xml\n"; }
  location = /sitemap.xml { alias /etc/moon-frontdoor/idobata-sitemap.xml; default_type application/xml; expires 1h; }
  # 署名付きbootstrapは未配備。空の成功応答を返さず探索を保留させる。
  location = /.well-known/idobata/bootstrap.json { default_type application/json; return 503 '{"status":"not_configured"}'; }
  location / { return 404; }
}
# END IDOBATA SITE
